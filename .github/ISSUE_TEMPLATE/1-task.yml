name: 작업
description: 만들거나 고칠 것 하나. 기능 추가·개선·정리 전부 여기.
title: "[작업] "
labels: ["enhancement"]
projects: ["planb-vt/1"]
body:
  - type: markdown
    attributes:
      value: |
        만들기만 하고 **착수하지 않습니다.** 보드의 `Backlog` 로 들어가고, 담당을 정해 `Ready` 로 올린 뒤 착수 지시가 있어야 시작합니다.

  - type: textarea
    id: goal
    attributes:
      label: 목적 (한 문장)
      description: 이 작업이 끝나면 무엇이 달라지나요? 제목만 보고 판단할 수 있게 한 문장으로.
      placeholder: 예) 설정 화면에서 각 프로그램의 빌드 번호를 한 번에 볼 수 있게 한다.
    validations:
      required: true

  - type: textarea
    id: area
    attributes:
      label: 수정할 영역 (파일·폴더 경로)
      description: 두 이슈가 같은 곳을 동시에 건드리면 충돌합니다. 아는 만큼 경로로 적어 주세요. 모르면 `조사 필요` 라고 적으면 됩니다.
      placeholder: |
        src/components/…
        Source/…
        Tools/…
      render: text
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇을 보고 "됐다"고 판단하나요? 눈으로 확인할 수 있는 것으로 적어 주세요.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: 담당
      description: "`Ready` 로 올릴 때 반드시 정해져 있어야 합니다."
      options:
        - 미정
        - TD — 플랫폼·배포
        - TA — 아트·룩
      default: 0
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: 실행 환경
      description: 엔진 빌드·배포판 만들기·화면 확인·카메라 입력이 필요하면 `로컬 PC 필요` 입니다. 클라우드에서 도는 에이전트는 그런 이슈에 착수하지 않고 댓글만 답니다.
      options:
        - 어디서나 가능
        - 로컬 PC 필요
      default: 0
    validations:
      required: true

  - type: textarea
    id: external-data
    attributes:
      label: 저장소 밖 데이터 의존
      description: |
        테스트용 원본 파일·보정 데이터·열쇠 파일처럼 **저장소에 없는 것**이 필요한가요?
        필요하다면 (1) 견본을 저장소에 같이 넣거나 (2) 받아오는 스크립트를 같이 올려야 합니다.
        그러지 않으면 다른 컴퓨터에서 재현되지 않습니다.
      value: 없음
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 관련 이슈·PR
      placeholder: "예) #12, 다른저장소#34"
